<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8f0f4"><title>Dr. Falak & Mahmmad Sarik | Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body class="opening-page">
<div class="glow glow-a"></div><div class="glow glow-b"></div>
<header class="topbar"><span class="brand-mark"><b><i> F </i> & <i> S </i></b></span><span class="topbar-label">A WEDDING INVITATION</span></header>
<main class="opening-layout">
  <p class="eyebrow">WITH THE BLESSINGS OF OUR FAMILIES</p>
  <h1>A beautiful beginning<br><em>starts here</em></h1>
  <p class="subcopy">You are cordially invited to the Rukhsati of</p>
  <div class="envelope-wrap">
    <button class="envelope" id="openLetter" aria-label="Open the invitation letter">
      <span class="envelope-back"></span><span class="letter">
        <span class="letter-kicker"><h2>Rukhsati</h2></span><span class="letter-names">Dr. Falak</span>
        <span class="letter-date">31 · OCTOBER · 2026</span>
      </span><span class="flap"></span><span class="envelope-front"></span><span class="wax">F<span>& </span> S</span>
    </button>
  </div>
  <button class="tap-open" id="tapOpen"><span></span> TAP THE LETTER TO OPEN <span></span></button>
  <p class="small-blessing">A PROMISE OF LOVE · A LIFETIME OF BARAKAH</p>
</main>
<script>
const letter=document.getElementById('openLetter');
function openLetter(){if(letter.classList.contains('opened'))return;letter.classList.add('opened');document.querySelector('.tap-open').textContent='OPENING YOUR INVITATION…';setTimeout(()=>{window.location.href='invitation.html'},850)}
letter.addEventListener('click',openLetter);document.getElementById('tapOpen').addEventListener('click',openLetter);
</script>

<audio id="weddingMusic" preload="none" loop>
  <source src="aaj-sajeya.mp3" type="audio/mpeg">
</audio>
<button class="music-control" id="musicControl" type="button" aria-label="Play wedding music">
  <span class="music-icon">♫</span><span id="musicLabel">PLAY MUSIC</span><span class="music-status" id="musicStatus">AAJ SAJEYA</span>
</button>
<script>
(() => {
  const audio = document.getElementById('weddingMusic');
  const button = document.getElementById('musicControl');
  const label = document.getElementById('musicLabel');
  const status = document.getElementById('musicStatus');
  if (!audio || !button) return;
  // Try autoplay when each page opens. Many browsers require the guest to tap Play Music.
  audio.volume = 0.55;
  audio.play().then(() => {
    button.classList.add('playing');
    label.textContent = 'PAUSE MUSIC';
    button.setAttribute('aria-label', 'Pause wedding music');
  }).catch(() => {
    label.textContent = 'PLAY MUSIC';
    status.textContent = 'AAJ SAJEYA';
  });
  button.addEventListener('click', async () => {
    if (audio.paused) {
      try {
        await audio.play();
        button.classList.add('playing');
        label.textContent = 'PAUSE MUSIC';
        status.textContent = 'NOW PLAYING';
        button.setAttribute('aria-label', 'Pause wedding music');
      } catch (e) {
        label.textContent = 'ADD MP3 FILE';
        status.textContent = 'CHECK FILE';
      }
    } else {
      audio.pause();
      button.classList.remove('playing');
      label.textContent = 'PLAY MUSIC';
      status.textContent = 'AAJ SAJEYA';
      button.setAttribute('aria-label', 'Play wedding music');
      
  }
  });
})();
</script>

</body></html>
